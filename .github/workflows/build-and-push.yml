name: Build and Push NocoDB Image
on:
  push:
    branches:
      - custom-0.263.8

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  working-directory: ./packages/nocodb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Add these steps from the first workflow
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      # Optional: Only if you need to upgrade packages for dev/nightly builds
      # - name: upgrade packages for nightly build or pr build
      #   run: |
      #     export NODE_OPTIONS="--max_old_space_size=16384"
      #     ... (copy the commands if needed)

      - name: Build nocodb integrations
        working-directory: ${{ env.working-directory }}
        run: |
          cd ../noco-integrations/core
          pnpm install nocodb-sdk@latest
          cd ../../..
          pnpm run integrations:build && pnpm run registerIntegrations

      - name: Build nocodb and docker files
        run: |
          pnpm install --ignore-scripts --no-frozen-lockfile
          pnpm run docker:build
        working-directory: ${{ env.working-directory }}

      # Now your existing steps
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        run: echo "TAG=$(jq -r '.version' packages/nocodb/package.json)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.TAG }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: packages/nocodb
          file: packages/nocodb/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
